name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull-request run proves nothing about the commit that replaced
# it; main keeps every run, so a red commit is never hidden by the next one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Which suites this diff can reach
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Some diffs cannot change what the binary does, and the minutes of
        # end-to-end spent on them prove nothing. Three kinds qualify: the
        # Version Packages commit changesets writes — changelogs, the changeset
        # files it consumed, and a version line, on a tree that already ran
        # this suite on the commit that introduced the changeset; prose and
        # pictures, which ship to readers rather than to the profile; and unit
        # specs, which the unit step just ran and which no binary loads.
        # Two more kinds reach one suite each, and run that suite alone: the
        # launcher in packages/cli, which only the wrapper suite boots (every
        # other suite drives the installed dsh launcher), and the image
        # modules, which nothing reaches without an image in play and which
        # the images suite drives end to end. The lists are spelled out rather
        # than globbed by extension: the day a skill ships as Markdown, it
        # should run everything, and a pattern written today would quietly
        # decide otherwise. Anything not named here — one other file, or one
        # other line inside a manifest — is code, and code runs everything.
        run: |
          set -euo pipefail
          verdict() {
            echo "heavy=$1" >> "$GITHUB_OUTPUT"
            echo "suites=${3:-}" >> "$GITHUB_OUTPUT"
            echo "$2"
            exit 0
          }
          [ -n "${BASE:-}" ] || verdict true 'nothing names the other end of the diff'
          # The checkout is one commit deep, which keeps every run's clone
          # cheap; this fetches the one other commit the diff needs.
          git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 \
            || verdict true 'the base commit is not reachable from here'
          changed="$(git diff --name-only "$BASE" HEAD)"
          [ -n "$changed" ] || verdict true 'nothing to compare'
          suites=''
          reach() { case " $suites " in *" $1 "*) ;; *) suites="${suites:+$suites }$1" ;; esac; }
          while IFS= read -r file; do
            case "$file" in
              .changeset/*.md|packages/*/CHANGELOG.md) continue ;;
              README.md|README.zh.md|CONTEXT.md|CONTRIBUTING.md|SECURITY.md|LICENSE) continue ;;
              docs/*|site/*|assets/*|packages/*/README.md) continue ;;
              packages/bundle/tests/*|scripts/*.spec.mjs|vitest.config.ts) continue ;;
              packages/*/package.json)
                beyond="$(git diff -U0 "$BASE" HEAD -- "$file" \
                  | grep -E '^[-+]' | grep -vE '^(\+\+\+|---)' \
                  | grep -vE '^[-+][[:space:]]*"version": "[^"]+",?$' || true)"
                [ -z "$beyond" ] || verdict true "$file changed more than its version"
                continue ;;
              packages/cli/*) reach e2e/wrapper.e2e.ts ;;
              packages/bundle/src/clipboard-image.ts|packages/bundle/src/image-meta.ts|packages/bundle/src/image-preview.ts|packages/bundle/src/image-resize.ts|packages/bundle/src/terminal-graphics.ts|packages/bundle/src/vision.ts)
                reach e2e/images.e2e.ts ;;
              *) verdict true "$file can change what the binary does" ;;
            esac
          done <<< "$changed"
          [ -z "$suites" ] || verdict true "only the suites that reach this diff run: $suites" "$suites"
          verdict false 'nothing here can change behaviour: the end-to-end suite is skipped'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Typecheck and the unit suites cost seconds and still catch a manifest
      # edited into nonsense, so they run either way.
      - run: pnpm test
      # Packs the tree and drives the real binary. Files run in parallel
      # against one shared profile template; it builds first, so there is
      # no separate build step to keep in step. With suites named, only those
      # files run; empty means all of them.
      - run: pnpm run test:e2e ${{ steps.scope.outputs.suites }}
        if: steps.scope.outputs.heavy != 'false'
