name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance only generates inside CI; local publishes stay plain.
          NPM_CONFIG_PROVENANCE: 'true'
      # changesets v3 stopped printing the "New tag:" lines the action parses,
      # so the tag push and the GitHub release silently no-op. This step is the
      # idempotent backstop: for every workspace package npm already carries,
      # make sure the monorepo-style tag and the release exist too.
      - name: Ensure tags and GitHub releases exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            tag="$name@$version"
            npm view "$tag" version >/dev/null 2>&1 || continue
            if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
              git tag "$tag" 2>/dev/null || true
              git push origin "$tag"
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              if [ -f "$dir/CHANGELOG.md" ]; then
                awk "/^## $version\$/{flag=1; next} /^## /{flag=0} flag" "$dir/CHANGELOG.md" > /tmp/release-notes.md
              else
                echo "$tag" > /tmp/release-notes.md
              fi
              gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md
            fi
          done
