name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both names on purpose: setup-node's .npmrc reads NODE_AUTH_TOKEN,
          # while the changesets action looks for NPM_TOKEN — without it the
          # action falls back to OIDC, which cannot create a NEW package.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance only generates inside CI; local publishes stay plain.
          NPM_CONFIG_PROVENANCE: 'true'
      # changesets v3 stopped printing the "New tag:" lines the action parses,
      # so the tag push and the GitHub release silently no-op. This step is the
      # idempotent backstop: for every workspace package npm already carries,
      # make sure the monorepo-style tag and the release exist too.
      - name: Ensure tags and GitHub releases exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            tag="$name@$version"
            # Steady state: an earlier run already tagged and released this
            # version, so there is nothing to prove and no registry to ask.
            if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1 \
              && gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi
            # npm answers its own publish with a lag. This step ran 1.3s after
            # changesets pushed 0.11.0, was told that version did not exist, and
            # took the `continue` — which is why every tag and release after
            # 0.6.0 is missing while each run stayed green. Only a version this
            # repo has never tagged reaches here, so the wait is paid once per
            # release and never on an ordinary push to main.
            published=''
            for _ in $(seq 1 12); do
              if npm view "$tag" version >/dev/null 2>&1; then published=1; break; fi
              sleep 5
            done
            [ -n "$published" ] || continue
            if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
              git tag "$tag" 2>/dev/null || true
              git push origin "$tag"
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              awk "/^## $version\$/{flag=1; next} /^## /{flag=0} flag" \
                "$dir/CHANGELOG.md" 2>/dev/null > /tmp/release-notes.md
              # A bump a sibling package carried leaves an empty section behind,
              # and an empty --notes-file is rejected; the tag still deserves a
              # release people can subscribe to.
              [ -s /tmp/release-notes.md ] || echo "Released \`$tag\` to npm." > /tmp/release-notes.md
              gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md
            fi
          done
