name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance only generates inside CI; local publishes stay plain.
          NPM_CONFIG_PROVENANCE: 'true'
      # changesets v3 stopped printing the "New tag:" lines the action parses,
      # so the tag push and the GitHub release silently no-op. This step is the
      # idempotent backstop: whenever npm already carries the current version,
      # make sure the tag and the release exist too.
      - name: Ensure tag and GitHub release exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "codsh-cli@$version" version >/dev/null 2>&1 || exit 0
          if ! git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
            git tag "v$version" 2>/dev/null || true
            git push origin "v$version"
          fi
          if ! gh release view "v$version" >/dev/null 2>&1; then
            awk "/^## $version\$/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
            gh release create "v$version" --title "codsh-cli $version" --notes-file /tmp/release-notes.md
          fi
