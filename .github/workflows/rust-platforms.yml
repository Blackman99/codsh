# Platform evidence for the Rust client (#198 macOS install/update/rollback;
# later #199 Linux, #200 Windows, #201/#202/#209). Runs on the rewrite
# integration branch and on ci/** branches pushed for a ticket's evidence.
# It builds every native directory, checks the multi-platform package layout,
# and installs the packed product on runners whose Rust toolchain has been
# removed. It publishes, tags and releases nothing.
name: Rust platforms

on:
  push:
    branches:
      - rewrite/grok-dsh-20260920
      - 'ci/**'

permissions:
  contents: read

concurrency:
  group: rust-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/rust-native.yml

  package:
    name: package layout (all natives)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true
      - name: Stage every native directory
        run: |
          mkdir -p packages/cli/native
          for archive in natives/native-*.tgz; do tar -C packages/cli/native -xzf "$archive"; done
          node scripts/build-ship-extension.mjs
      - name: Check the package a release would publish (dry run)
        run: |
          mkdir -p packed
          pnpm run --silent check:rust-package -- --require darwin-arm64,darwin-x64,linux-x64,linux-arm64,win32-x64 --json | tee packed/package-check.json
      - name: Pack codsh-cli (not published)
        run: |
          (cd packages/cli && npm pack --ignore-scripts --pack-destination ../../packed)
          ls -l packed
          tar -tzf packed/codsh-cli-*.tgz | grep -E '^package/native/[^/]+/(codsh-rust|artifact.json)$'
      - uses: actions/upload-artifact@v4
        with:
          name: codsh-cli-package
          path: packed/
          if-no-files-found: error

  macos-install:
    name: macOS install ${{ matrix.name }}
    needs: [native, package]
    # Every platform on the integration branch; on a ci/** evidence branch
    # only the platform its name carries (ci/198-macos-…), to spare runners.
    if: github.ref_name == 'rewrite/grok-dsh-20260920' || contains(github.ref_name, 'macos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            os: macos-15
            rosetta: false
          - name: x64 (Intel)
            os: macos-15-intel
            rosetta: false
          - name: x64 Node under Rosetta
            os: macos-15
            rosetta: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # dsh for the install test comes from this checkout, as it does locally.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: codsh-cli-package
          path: packed
      - name: Stage the natives a release would carry
        run: |
          mkdir -p packages/cli/native
          for archive in natives/native-*.tgz; do tar -C packages/cli/native -xzf "$archive"; done
          node scripts/build-ship-extension.mjs
      - name: Remove the Rust toolchain
        run: |
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          # The image also links Homebrew's rustup; take every entry off PATH.
          for tool in cargo rustc rustup rustup-init; do
            while found=$(command -v "$tool"); do
              echo "removing $found"
              rm -f "$found" 2>/dev/null || sudo rm -f "$found"
              hash -r
            done
          done
          if command -v cargo || command -v rustc || command -v rustup; then echo "a Rust toolchain is still on PATH"; exit 1; fi
          echo "no cargo, rustc or rustup on PATH"
      - name: Use an x64 Node under Rosetta
        if: matrix.rosetta
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          echo "CODSH_TEST_TOOL_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
          version=$(node -p process.version)
          curl -fsSLO "https://nodejs.org/dist/$version/node-$version-darwin-x64.tar.gz"
          curl -fsSL "https://nodejs.org/dist/$version/SHASUMS256.txt" | grep " node-$version-darwin-x64.tar.gz\$" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/node-x64"
          tar -C "$RUNNER_TEMP/node-x64" --strip-components=1 -xzf "node-$version-darwin-x64.tar.gz"
          echo "$RUNNER_TEMP/node-x64/bin" >> "$GITHUB_PATH"
      - name: dsh from the registry, as a user installs it
        # The version this codsh-cli was tested with (codsh.testedDsh), with
        # the job's own Node (x64 under Rosetta: dsh loads per-arch addons).
        run: |
          tested=$(node -p "require('./packages/cli/package.json').codsh.testedDsh")
          node -p process.arch
          npm install -g --prefix "$RUNNER_TEMP/dsh-registry" --no-audit --no-fund "@deepseek-ai/dsh@$tested"
          echo "CODSH_INSTALL_TEST_DSH=$RUNNER_TEMP/dsh-registry/lib/node_modules/@deepseek-ai/dsh" >> "$GITHUB_ENV"
          echo "CODSH_TESTED_DSH_VERSION=$tested" >> "$GITHUB_ENV"
      - name: Record the environment
        run: |
          mkdir -p evidence
          {
            sw_vers
            uname -a
            echo "hardware: $(sysctl -n machdep.cpu.brand_string)  hw.optional.arm64=$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)"
            echo "node: $(command -v node) $(node -p 'process.version + " " + process.platform + "-" + process.arch')"
            echo "node translated by Rosetta: $(node -e "const r=require('child_process').spawnSync('sysctl',['-in','sysctl.proc_translated'],{encoding:'utf8'});process.stdout.write((r.stdout||'').trim()||'0')")"
            echo "npm: $(npm -v)  python3: $(python3 -V)"
            echo "cargo on PATH: $(command -v cargo || echo none)"
          } | tee evidence/environment.txt
      - name: Launcher explains a missing x64 client under Rosetta
        if: matrix.rosetta
        run: |
          copy="$RUNNER_TEMP/arm64-only"
          mkdir -p "$copy/native"
          cp -R packages/cli/bin packages/cli/package.json "$copy/"
          cp -R packages/cli/native/darwin-arm64 "$copy/native/"
          set +e
          node "$copy/bin/codsh.mjs" --rust install-check > evidence/rosetta-missing.txt 2>&1
          status=$?
          set -e
          cat evidence/rosetta-missing.txt
          test "$status" = 1
          grep -q 'Rosetta' evidence/rosetta-missing.txt
      - name: Install the packed release tarball into a clean prefix
        run: |
          prefix="$RUNNER_TEMP/clean-prefix"
          export npm_config_cache="$RUNNER_TEMP/npm-cache"
          tarball=$(ls "$PWD"/packed/codsh-cli-*.tgz)
          echo "installing $tarball"
          # The README's one-liner, with the packed tarball for codsh-cli.
          npm install -g --prefix "$prefix" --no-audit --no-fund "@deepseek-ai/dsh@$CODSH_TESTED_DSH_VERSION" "$tarball"
          HOME="$RUNNER_TEMP/clean-home" && mkdir -p "$HOME" && export HOME
          cd "$RUNNER_TEMP"
          PATH="$prefix/bin:$PATH" "$prefix/bin/codsh" --rust install-check --json | tee "$GITHUB_WORKSPACE/evidence/clean-install-check.json"
          node -e "const r=require('$GITHUB_WORKSPACE/evidence/clean-install-check.json'); if (!r.ok || !r.dsh.entry.startsWith('$prefix') || r.dsh.version !== process.env.CODSH_TESTED_DSH_VERSION) { console.error('install-check did not use the registry dsh'); process.exit(1) }"
          cd "$GITHUB_WORKSPACE"
          "$prefix/bin/codsh" --rust --version | tee evidence/clean-version.txt
          grep -q "codsh-rust $(node -p "require('./packages/cli/package.json').version") " evidence/clean-version.txt
      - name: Install, update, break and roll back the packed product
        run: |
          python3 scripts/rust-install-test.py | tee evidence/rust-install-test.txt
          cp /tmp/codsh-rust-install-out-*/result.json evidence/rust-install-result.json
      - name: Installed-product PTY, isolation and network audit
        if: ${{ !matrix.rosetta }}
        run: python3 scripts/rust-pty-test.py --output "$PWD/evidence/rust-pty"
      - name: First-phase flows on the installed product (turn, approval, cancel, resume, legacy Homes)
        if: ${{ !cancelled() && !matrix.rosetta }}
        run: |
          status=0
          for test in turn permission cancel resume legacy-home; do
            echo "::group::rust-$test-pty-test.py"
            if python3 "scripts/rust-$test-pty-test.py" > "evidence/rust-$test-pty-test.txt" 2>&1; then echo "PASS rust-$test-pty-test.py"; else echo "FAIL rust-$test-pty-test.py"; status=1; fi
            tail -n 20 "evidence/rust-$test-pty-test.txt"
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-evidence-${{ matrix.os }}-${{ matrix.rosetta && 'rosetta' || 'native' }}
          path: evidence
          if-no-files-found: warn

  linux-platform:
    name: Linux ${{ matrix.name }}
    needs: [native, package]
    if: github.ref_name == 'rewrite/grok-dsh-20260920' || contains(github.ref_name, 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 Ubuntu 22.04
            os: ubuntu-22.04
          - name: x64 Ubuntu 24.04
            os: ubuntu-24.04
          - name: arm64 Ubuntu 22.04
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true
      - name: Stage the natives a release would carry
        run: |
          mkdir -p packages/cli/native
          for archive in natives/native-*.tgz; do tar -C packages/cli/native -xzf "$archive"; done
          node scripts/build-ship-extension.mjs
      - name: Remove the Rust toolchain
        run: |
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          for tool in cargo rustc rustup; do
            while found=$(command -v "$tool"); do rm -f "$found" 2>/dev/null || sudo rm -f "$found"; hash -r; done
          done
          if command -v cargo || command -v rustc || command -v rustup; then exit 1; fi
          echo "no cargo, rustc or rustup on PATH"
      - name: dsh from the registry, as a user installs it
        run: |
          tested=$(node -p "require('./packages/cli/package.json').codsh.testedDsh")
          npm install -g --prefix "$RUNNER_TEMP/dsh-registry" --no-audit --no-fund "@deepseek-ai/dsh@$tested"
          echo "CODSH_INSTALL_TEST_DSH=$RUNNER_TEMP/dsh-registry/lib/node_modules/@deepseek-ai/dsh" >> "$GITHUB_ENV"
      - name: Platform run (install-check, install/update/rollback, turn, approval, cancel, resume)
        run: python3 scripts/rust-platform-test.py --output "$PWD/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-evidence-${{ matrix.os }}
          path: evidence
          if-no-files-found: warn

  linux-containers:
    name: Linux clean system ${{ matrix.image }}
    needs: [native, package]
    if: github.ref_name == 'rewrite/grok-dsh-20260920' || contains(github.ref_name, 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported: glibc at or above the recorded floor, no libssl, no Rust.
          - image: node:22-bookworm-slim
            expect: ok
            python: apt
          - image: node:24-trixie-slim
            expect: ok
            python: apt
          - image: fedora:41
            expect: ok
            python: dnf
          # Refused with the fix, before any Home is created.
          - image: node:22-bullseye-slim
            expect: glibc
          - image: node:22-alpine
            expect: libc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true
      - name: Stage the natives a release would carry
        run: |
          mkdir -p packages/cli/native
          for archive in natives/native-*.tgz; do tar -C packages/cli/native -xzf "$archive"; done
          node scripts/build-ship-extension.mjs
      - name: Run in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          EXPECT: ${{ matrix.expect }}
          PYTHON: ${{ matrix.python }}
        run: |
          mkdir -p evidence
          cat > evidence/run.sh <<'SCRIPT'
          set -eu
          case "${PYTHON:-}" in
            apt) apt-get update -qq && apt-get install -y -qq python3 >/dev/null ;;
            dnf) dnf install -y -q nodejs npm python3 >/dev/null ;;
          esac
          cat /etc/os-release | head -2
          node -p 'process.version + " " + process.arch + " glibc=" + (process.report.getReport().header.glibcVersionRuntime || "none")'
          ldd --version 2>&1 | head -1 || true
          for tool in cargo rustc rustup; do if command -v "$tool"; then echo "unexpected $tool"; exit 1; fi; done
          ls /usr/lib/x86_64-linux-gnu/libssl.so.3 /usr/lib64/libssl.so.3 2>/dev/null || echo "no libssl.so.3 on this system"
          if [ "$EXPECT" = ok ]; then
            # The dsh a user installs on this system (codsh.testedDsh from the registry).
            tested=$(node -p "require('./packages/cli/package.json').codsh.testedDsh")
            npm install -g --prefix /tmp/dsh-registry --no-audit --no-fund "@deepseek-ai/dsh@$tested" >/dev/null
            export CODSH_INSTALL_TEST_DSH=/tmp/dsh-registry/lib/node_modules/@deepseek-ai/dsh
            python3 scripts/rust-platform-test.py --only install-check,install --output "$PWD/evidence/platform"
          else
            work=$(mktemp -d)
            (cd packages/cli && npm pack --ignore-scripts --pack-destination "$work" >/dev/null)
            npm install -g --prefix "$work/prefix" --offline --ignore-scripts --no-audit --no-fund "$work"/codsh-cli-*.tgz >/dev/null 2>&1
            export HOME="$work/home" && mkdir -p "$HOME"
            set +e
            "$work/prefix/bin/codsh" --rust install-check --json > evidence/install-check.json
            check=$?
            "$work/prefix/bin/codsh" --rust -p hello > evidence/launch.txt 2>&1
            launch=$?
            set -e
            cat evidence/install-check.json evidence/launch.txt
            test "$check" = 1 && test "$launch" = 1
            node -e "const r=require('./evidence/install-check.json'); if (r.runtime.code !== process.env.EXPECT) { console.error('expected', process.env.EXPECT, 'got', r.runtime.code); process.exit(1) }"
            test ! -e "$HOME/.codsh-rust" && echo "no Rust Home was created"
          fi
          SCRIPT
          docker run --rm -e EXPECT -e PYTHON -v "$PWD:$PWD" -w "$PWD" "$IMAGE" sh evidence/run.sh 2>&1 | tee evidence/container.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-container-evidence-${{ strategy.job-index }}
          path: evidence
          if-no-files-found: warn

  # Native Windows (#200): the packed product installed with npm on a runner
  # without a Rust toolchain, driven through ConPTY (pywinpty) inside cmd.exe.
  windows:
    name: Windows ${{ matrix.os }}
    needs: [native, package]
    if: github.ref_name == 'rewrite/grok-dsh-20260920' || contains(github.ref_name, 'windows')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install pywinpty==2.0.15
      - uses: actions/download-artifact@v4
        with:
          name: codsh-cli-package
          path: packed
      - name: Remove the Rust toolchain
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction SilentlyContinue
          foreach ($tool in 'cargo', 'rustc', 'rustup') {
            if (Get-Command $tool -ErrorAction SilentlyContinue) { Write-Error "$tool still on PATH"; exit 1 }
          }
          "no cargo, rustc or rustup on PATH"
      - name: Windows run through ConPTY
        shell: pwsh
        run: |
          $package = (Get-ChildItem packed\codsh-cli-*.tgz | Select-Object -First 1).FullName
          python scripts/rust-windows-pty-test.py --package $package --output "$PWD\evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-evidence-${{ matrix.os }}
          path: evidence
          if-no-files-found: warn

  macos-perf:
    # Interaction performance on the installed product against the pinned
    # reference (#202). Only on ci/** branches whose name carries "perf":
    # a full run takes most of an hour of a macOS runner. The reference binary
    # is downloaded, SHA-256 checked and never uploaded.
    name: macOS perf (reference baseline, frozen thresholds, candidate)
    needs: [native, package]
    if: contains(github.ref_name, 'perf')
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: codsh-cli-package
          path: packed
      - name: Install the packed product with the registry dsh, as a user does
        run: |
          tested=$(node -p "require('./packages/cli/package.json').codsh.testedDsh")
          prefix="$RUNNER_TEMP/perf-prefix"
          npm install -g --prefix "$prefix" --no-audit --no-fund "@deepseek-ai/dsh@$tested" "$(ls "$PWD"/packed/codsh-cli-*.tgz)"
          echo "PERF_LAUNCHER=$prefix/lib/node_modules/codsh-cli/bin/codsh.mjs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/perf-check-home"
          HOME="$RUNNER_TEMP/perf-check-home" "$prefix/bin/codsh" --rust install-check
      - name: Fetch the pinned reference (checked, not redistributed)
        run: |
          mkdir -p "$RUNNER_TEMP/reference"
          curl -fsSL -o "$RUNNER_TEMP/reference/grok" https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-1.0.34-macos-aarch64
          chmod +x "$RUNNER_TEMP/reference/grok"
          shasum -a 256 "$RUNNER_TEMP/reference/grok"
      - name: Bench driver
        run: |
          python3 -m venv "$RUNNER_TEMP/perf-venv"
          "$RUNNER_TEMP/perf-venv/bin/pip" install --quiet 'pyte==0.8.2'
      - name: Reference baseline, freeze, candidate (alternating with reference controls)
        run: |
          "$RUNNER_TEMP/perf-venv/bin/python" scripts/rust-perf-bench.py \
            --reference "$RUNNER_TEMP/reference/grok" --launcher "$PERF_LAUNCHER" \
            --runs "${PERF_RUNS:-30}" --cold-runs "${PERF_COLD_RUNS:-30}" --purge --output "$PWD/evidence/perf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-perf
          path: evidence/perf
          if-no-files-found: warn

  capability-matrix:
    # Three-platform capability matrix (#201). Records OS/terminal versions and
    # runs the installed-product checks: keys, mouse, shell, cancel, screen
    # modes, terminal restore, the real clipboard (pasteboard / X11 under
    # xvfb / Windows), voice doctor without fixtures, sandbox profiles, SSH,
    # real tmux and the Windows ConPTY harness. Missing devices and refused
    # features are recorded as refused/unavailable, never as a silent pass.
    # Runs on the integration branch and on branches whose name has "matrix".
    name: Capability matrix (${{ matrix.name }})
    needs: [native, package]
    if: github.ref == 'refs/heads/rewrite/grok-dsh-20260920' || contains(github.ref_name, 'matrix')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: codsh-cli-package
          path: packed
      - name: Stage the natives a release would carry
        shell: bash
        run: |
          mkdir -p packages/cli/native
          for archive in natives/native-*.tgz; do tar -C packages/cli/native -xzf "$archive"; done
          node scripts/build-ship-extension.mjs
      - name: Terminal tools (tmux, X11 clipboard, OpenSSH)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux xclip xvfb openssh-server openssh-client >/dev/null
          tmux -V; xclip -version 2>&1 | head -1; /usr/sbin/sshd -V 2>&1 | head -1 || true
      - name: Terminal tools (tmux)
        if: runner.os == 'macOS'
        run: |
          command -v tmux || brew install tmux
          tmux -V
      - name: Install the packed product with the registry dsh, as a user does
        shell: bash
        run: |
          tested=$(node -p "require('./packages/cli/package.json').codsh.testedDsh")
          prefix="$RUNNER_TEMP/matrix-prefix"
          npm install -g --prefix "$prefix" --no-audit --no-fund "@deepseek-ai/dsh@$tested" "$(ls "$PWD"/packed/codsh-cli-*.tgz)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "CODSH_MATRIX_LAUNCHER=$prefix/node_modules/codsh-cli/bin/codsh.mjs" >> "$GITHUB_ENV"
          else
            echo "CODSH_MATRIX_LAUNCHER=$prefix/lib/node_modules/codsh-cli/bin/codsh.mjs" >> "$GITHUB_ENV"
          fi
      - name: Windows ConPTY driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pywinpty==2.0.15
          New-Item -ItemType Directory -Force evidence | Out-Null
          python scripts/rust-windows-pty-test.py --package (Get-ChildItem packed/codsh-cli-*.tgz).FullName --output "$PWD\evidence"
      - name: Capability matrix
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p evidence
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/rust-capability-matrix.py --output "$PWD/evidence"
          else
            python scripts/rust-capability-matrix.py --output "$PWD/evidence"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-matrix-${{ matrix.name }}
          path: evidence
          if-no-files-found: warn
