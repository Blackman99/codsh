<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">codsh — a terminal coding agent, composed on the DeepSeek Harness</title>
<desc id="d">A dark terminal panel. On the left the codsh mark — a whale carrying a sail whose leading edge is a slash, /ship riding the harness — beside the wordmark with a blinking block cursor and a one-line description. On the right a miniature transcript in the surface's own marks: the person's own message as a filled plum panel behind a cyan rule, a tool call as a card on its own panel behind an amber rule with a green tick and a diff count, a collapsed thinking row behind a magenta asterisk, the timeline rail marking the turn down the right edge, the input box that never leaves the bottom, the working row, and the status row.</desc>

<style>
  /* Generic stacks only: a banner loaded as an image never fetches a font. */
  .m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .ink { fill: #e8e6e1; }
  .soft { fill: #b6b8bb; }
  .dim { fill: #8a8f96; }
  .muted { fill: #868b93; }
  /* The roles the surface actually paints these marks in. */
  .user { fill: #d98ce8; }
  .rule-user { fill: #6fd6d0; }
  .rule-tool { fill: #e6c67c; }
  .ok { fill: #8fce92; }
  .wordmark { font-size: 76px; font-weight: 700; letter-spacing: -0.035em; }
  .tag { font-size: 17px; }
  .meta { font-size: 13px; letter-spacing: 0.04em; }
  .line { font-size: 15px; }
  .small { font-size: 13.5px; }

  /* The one moving part: the cursor the box always shows. */
  .caret { animation: blink 1.25s steps(1) infinite; }
  @keyframes blink {
    0%, 45% { opacity: 1 }
    50%, 95% { opacity: 0.15 }
  }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none }
  }
</style>

<defs>
  <radialGradient id="glow" cx="76%" cy="0%" r="72%">
    <stop offset="0%" stop-color="#6fd6d0" stop-opacity="0.16"/>
    <stop offset="60%" stop-color="#6fd6d0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="4%" cy="10%" r="55%">
    <stop offset="0%" stop-color="#d98ce8" stop-opacity="0.14"/>
    <stop offset="70%" stop-color="#d98ce8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.022"/>
  </pattern>
  <clipPath id="panel">
    <rect width="1200" height="340" rx="18"/>
  </clipPath>
</defs>

<!-- The panel is opaque, so the banner reads the same on a light README. -->
<g clip-path="url(#panel)">
  <rect width="1200" height="340" fill="#0b0d0f"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>
  <rect width="1200" height="340" fill="url(#scan)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#21262d"/>

<!--
  ── Left: the wordmark, what it is, and how to get it ────────────────────
  Every line is one text element flowing from a single x. A banner loaded as
  an image renders in whatever monospace the reader has, so positioning words
  by hand — a separator placed at its own x, a cursor beside the wordmark —
  drifts into a collision on the first machine whose font is a little wider.
-->
<!-- The mark from assets/logo.svg: a › sail, a hull, water, and a whale tail. -->
<g transform="translate(28 42) scale(0.42)">
  <rect x="20" y="20" width="200" height="200" rx="44" fill="#10173a"/>
  <path d="M96,52 L142,86 L96,120" fill="none" stroke="#7e96f5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M82,132 L158,132 L144,152 L96,152 Z" fill="#eef1fb"/>
  <path d="M56,166 Q72,158 88,166 T120,166 T152,166 T184,166" fill="none" stroke="#3d56d6" stroke-width="5" stroke-linecap="round"/>
  <path fill="#3d56d6" d="M120,206 C112,192 100,185 86,187 C97,174 111,175 120,184 C129,175 143,174 154,187 C140,185 128,192 120,206 Z"/>
</g>

<g class="m">
  <text class="wordmark ink" x="156" y="148">codsh<tspan class="caret user" dx="8">▌</tspan></text>

  <text class="tag soft" x="60" y="210"><tspan class="user">/ship</tspan> takes one sentence</text>
  <text class="tag soft" x="60" y="236">to verified code.</text>

  <text class="meta muted" x="60" y="290">npm i -g codsh-cli · MIT</text>
  <text class="meta muted" x="60" y="312">one dsh per machine, however many tools</text>
</g>

<!--
  ── Right: a transcript, told in the surface's own marks ──────────────────
  Read off a real capture (site/data/screens.json), which is why the rules
  are the colours they are: cyan for the person, amber for a tool card,
  magenta for thinking. Each block is a filled panel with a padding row of
  its own fill above and below, and every row here is one text element, so
  the glyphs flow in whatever monospace the reader has rather than colliding.
-->
<rect x="470.5" y="26.5" width="681" height="287" rx="11" fill="#0f1216" stroke="#21262d"/>

<!-- The block fills, drawn the way the surface paints them: to the content's
     full width, because a blank cell carrying a fill is ink, not padding. A
     row is 22 units tall and its baseline sits 16 below the cell's top. -->
<g>
  <rect x="500" y="34" width="620" height="66" fill="#1e1326"/>
  <rect x="500" y="100" width="620" height="66" fill="#0e1218"/>
  <rect x="500" y="166" width="620" height="22" fill="#141020"/>
</g>

<g class="m">
  <!-- The person's own message: a plum panel behind a cyan rule, padded above
       and below with a row of its own fill. -->
  <text class="line rule-user" x="484" y="50">›</text>
  <text class="line rule-user" x="484" y="72">›<tspan class="ink" xml:space="preserve">   ship the pager for long diffs</tspan></text>
  <text class="line rule-user" x="484" y="94">›</text>

  <!-- A tool call: its own panel, an amber rule, the presenter's title, the
       diff count, and the tick that says it landed. -->
  <text class="line rule-tool" x="484" y="116">│</text>
  <text class="line rule-tool" x="484" y="138">│<tspan class="ok" xml:space="preserve">   ●</tspan><tspan class="ink" xml:space="preserve"> Write docs/specs/pager.md </tspan><tspan class="muted">+42 -0</tspan><tspan class="ok" xml:space="preserve"> ✔</tspan></text>
  <text class="line rule-tool" x="484" y="160">│</text>

  <!-- Thinking, collapsed to the one row that says how long it took. -->
  <text class="line user" x="484" y="182">✻<tspan class="dim" xml:space="preserve">   thought for 3.2s</tspan></text>

  <!-- The timeline rail: one column at the right edge marking the turn. -->
  <text class="line muted" x="1132" y="50">↑</text>
  <text class="line muted" x="1132" y="72">·</text>
  <text class="line rule-user" x="1132" y="94">●</text>
  <text class="line muted" x="1132" y="116">·</text>
  <text class="line muted" x="1132" y="160">↓</text>

  <!-- The input box, which never leaves the bottom. -->
  <text class="line rule-user" x="484" y="208">╭───────────────────────────────────────────────────────────────────╮</text>
  <text class="line rule-user" x="484" y="230">│ <tspan class="user">›</tspan> <tspan class="dim">Ask anything · / for commands · $ for skills · @ for f…</tspan>    │</text>
  <text class="line rule-user" x="484" y="252">╰───────────────────────────────────────────────────────────────────╯</text>

  <!-- The working row, then the status row: model, where you are, and the key
       that lists the rest. One element each, so nothing drifts apart. -->
  <text class="small" x="484" y="274"><tspan class="rule-tool">⠻</tspan><tspan class="dim"> working 4.1s · 1.2k tokens · ESC to interrupt</tspan></text>
  <text class="small muted" x="484" y="296">deepseek-v4-flash (high) · ~/my-project (main) · ? shortcuts</text>
</g>

</svg>
