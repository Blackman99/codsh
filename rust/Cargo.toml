[workspace]
resolver = "2"
members = [
    ".",
    "upstream/xai-ratatui-textarea",
    "upstream/xai-ratatui-inline",
    "upstream/xai-grok-markdown-core",
    "upstream/xai-grok-markdown",
    "upstream/xai-workflow",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-parse = "0.2"
anstyle-syntect = "1.0.4"
ansi-width = "0.1"
anyhow = "1"
arboard = "3.6"
colored_json = "5"
criterion = "0.6"
crossterm = "0.28"
fuzzy-matcher = "0.3.7"
html-escape = "0.2"
ignore = "0.4"
itertools = "0.14"
libc = "0.2"
linkify = "0.10"
lipsum = "0.9"
pretty_assertions = "1"
pulldown-cmark = "0.13"
rand = "0.9"
ratatui = "0.29"
ratatui-core = "0.1"
rhai = { version = "1.25", features = ["serde"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
supports-color = "3.0"
syntect = { version = "5.3", default-features = false, features = ["default-onig"] }
tempfile = "3"
termwiz = { version = "0.23", default-features = false }
textwrap = "0.16"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
tracing = "0.1"
tui-scrollbar = "0.2"
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
xai-grok-markdown = { path = "upstream/xai-grok-markdown" }
xai-grok-markdown-core = { path = "upstream/xai-grok-markdown-core" }
xai-ratatui-inline = { path = "upstream/xai-ratatui-inline" }
xai-ratatui-textarea = { path = "upstream/xai-ratatui-textarea" }
xai-workflow = { path = "upstream/xai-workflow" }

[workspace.lints.clippy]
too_many_arguments = "allow"

[package]
name = "codsh-rust"
version = "0.1.0"
edition.workspace = true
license = "MIT AND Apache-2.0"
# rusqlite 0.37 is MIT. Its bundled libsqlite3-sys 0.35.0 ships SQLite 3.50.2,
# which is public domain. The `bundled` feature compiles that amalgamation with
# FTS5 (`SQLITE_ENABLE_FTS5`). vec0 embeddings stay out of this crate.
publish = false

[lints]
workspace = true

[dependencies]
anstyle.workspace = true
base64 = "0.22"
crossterm = { workspace = true, features = ["bracketed-paste"] }
ed25519-dalek = "2"
getrandom = "0.3"
ignore.workspace = true
jsonschema = { version = "=0.30.0", default-features = false }
native-tls = "0.2"
nono = { version = "=0.53.0", default-features = false }
ratatui = { workspace = true, features = ["unstable-widget-ref"] }
regex = "1.12.4"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
toml = "1.1.6"
unicode-segmentation.workspace = true
unicode-width.workspace = true
url = "=2.5.8"
zstd = "0.13"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
xai-grok-markdown.workspace = true
xai-grok-markdown-core.workspace = true
xai-ratatui-inline.workspace = true
xai-ratatui-textarea.workspace = true
xai-workflow.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
